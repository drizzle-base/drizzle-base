services:
  pg:
    image: postgres:18.6
    container_name: drizzlebase-pg
    env_file: .env
    environment:
      POSTGRES_DB: dzb_test
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=32", "-c", "max_wal_senders=32"]
    ports: ["127.0.0.1:5478:5432"]
    shm_size: 512m
    volumes: ["dzb-pg:/var/lib/postgresql"]
volumes:
  dzb-pg: {}
