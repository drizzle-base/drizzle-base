# CI: what `bun run check` and `bun run test` do on a developer's machine, on every pull request and on main.
# Actions are pinned to a commit (supply chain); the tag they correspond to is in the comment.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Biome, typecheck, unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check

  test:
    name: test (Postgres 18, logical replication, e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      # The same server docker-compose.yml runs locally, under the same container name (a capture test signals the
      # walsender through `docker exec drizzlebase-pg`). The password is random per run, masked in the logs, and the
      # port is bound to loopback only.
      - name: Start Postgres 18 with logical replication
        run: |
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          echo "POSTGRES_PASSWORD=$pw" >> "$GITHUB_ENV"
          docker run -d --name drizzlebase-pg --shm-size=512m \
            -e POSTGRES_PASSWORD="$pw" -e POSTGRES_DB=dzb_test \
            -p 127.0.0.1:5478:5432 postgres:18.6 \
            -c wal_level=logical -c max_replication_slots=32 -c max_wal_senders=32
          # Over TCP: the image's init step runs a temporary server on the Unix socket only.
          for i in $(seq 1 60); do
            docker exec drizzlebase-pg pg_isready -h 127.0.0.1 -U postgres -d dzb_test >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs drizzlebase-pg
          exit 1

      - name: Install Chromium for the studio's end-to-end tests
        working-directory: packages/studio
        run: bunx playwright install --with-deps chromium

      - run: bun run test
